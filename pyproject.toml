[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gospelo-test-runner"
version = "0.1.0"
description = "Generic test execution harness with pluggable executors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "gospelo" },
]
dependencies = [
    "pyyaml>=6.0",
]

keywords = [
    "test-engine",
    "test-automation",
    "evidence-collection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
gospelo-test-runner = "gospelo_test_runner.cli:main"

[project.entry-points."gospelo_test_runner.executors"]
http = "gospelo_test_runner.executor.http_executor:HttpExecutor"
process = "gospelo_test_runner.executor.process_executor:ProcessExecutor"
assert = "gospelo_test_runner.executor.assert_executor:AssertExecutor"

[project.urls]
Repository = "https://github.com/gospelo/test-runner"

[tool.hatch.build.targets.sdist]
include = [
    "gospelo_test_runner/",
]

[tool.hatch.build.targets.wheel]
packages = ["gospelo_test_runner"]

[tool.ruff]
target-version = "py311"
line-length = 100
